name: litellm-exclusive-pool

x-image: &image
  image: ${LITELLM_IMAGE:-cr.selcloud.ru/ttkdc/litellm:exclusive-pool-key-policies-20261105}
  platform: linux/amd64
  build:
    context: ../..
    dockerfile: Dockerfile
    target: runtime
    args:
      LITELLM_RELEASE_TAG: exclusive-pool-key-policies-20261105

x-pool-environment: &pool-environment
  LITELLM_LOCAL_MODEL_COST_MAP: "True"
  EXCLUSIVE_POOL_CONFIG: /etc/litellm/pool.json
  EXCLUSIVE_POOL_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0

services:
  proxy:
    <<: *image
    restart: unless-stopped
    init: true
    command: ["--config", "/etc/litellm/proxy.yaml", "--port", "4000", "--num_workers", "2"]
    environment:
      <<: *pool-environment
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?set LITELLM_SALT_KEY in .env}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/litellm
    volumes:
      - type: bind
        source: ./proxy.yaml
        target: /etc/litellm/proxy.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./pool.json
        target: /etc/litellm/pool.json
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "${LITELLM_BIND:-127.0.0.1}:${LITELLM_PORT:-4000}:4000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5).close()"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s

  pool-admin:
    <<: *image
    profiles: ["ops"]
    init: true
    entrypoint: ["python", "-m", "litellm.router_utils.exclusive_pool.admin"]
    command: ["status"]
    environment: *pool-environment
    volumes:
      - type: bind
        source: ./pool.json
        target: /etc/litellm/pool.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4.12-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command:
      - /bin/sh
      - -ec
      - 'exec redis-server --appendonly yes --appendfsync always --maxmemory 256mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17.11-alpine3.24@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_DB: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "litellm", "-d", "litellm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
  postgres-data:
